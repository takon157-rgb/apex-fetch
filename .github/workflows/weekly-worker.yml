name: Weekly Trending Worker

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Trigger weekly trend discovery
        # The endpoint handles a bounded slice of company domains per call and
        # answers {"done": true} when the list is exhausted. A single call used
        # to walk every domain, which the platform killed partway through.
        run: |
          set -euo pipefail
          OFFSET=0
          for i in $(seq 1 120); do
            RESP=$(curl -s -X GET "${{ secrets.APP_URL }}/api/cron/worker?offset=$OFFSET" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -w "\nHTTP %{http_code}")
            echo "$RESP"
            if echo "$RESP" | grep -q '"done"[[:space:]]*:[[:space:]]*true'; then
              echo "Weekly worker complete."
              exit 0
            fi
            NEXT=$(echo "$RESP" | sed -n 's/.*"nextOffset"[[:space:]]*:[[:space:]]*\([0-9]\{1,\}\).*/\1/p' | tail -1)
            if [ -z "$NEXT" ] || [ "$NEXT" = "$OFFSET" ]; then
              echo "No progress made, stopping."
              exit 1
            fi
            OFFSET=$NEXT
            sleep 2
          done
          echo "Reached the iteration limit before the worker finished."
          exit 1
